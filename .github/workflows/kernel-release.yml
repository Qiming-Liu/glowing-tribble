name: Manual Bazzite kernel release
run-name: Bazzite module for ${{ inputs.kernel_version }}

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Exact Bazzite OGC kernel release (uname -r)"
        required: true
        type: string
        default: "7.2.9-ogc3.1.fc44.x86_64"

permissions:
  contents: read

concurrency:
  group: manual-kernel-${{ inputs.kernel_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      kernel_version: ${{ steps.build.outputs.kernel_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Build and verify exact kernel module
        id: build
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: bash .github/scripts/build-bazzite-kernel.sh

      - name: Upload verified module and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazzite-kernel-module
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bazzite-kernel-module
          path: out

      - name: Create kernel-specific Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: kernel-${{ needs.build.outputs.kernel_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Bazzite ${{ needs.build.outputs.kernel_version }}
          body_path: out/BUILD.md
          files: out/*
          fail_on_unmatched_files: true
          make_latest: false
          draft: false
          prerelease: false
